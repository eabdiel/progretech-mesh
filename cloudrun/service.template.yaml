apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: progretech-mesh
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3600
      containers:
        - image: IMAGE_URL
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: APP_ENV
              value: production
            - name: MESH_DEPLOYMENT_TIER
              value: staging
            - name: DEV_AUTH_ENABLED
              value: "0"
            - name: DEV_SEED_AGENTS
              value: "0"
            - name: TRUST_PROXY_HEADERS
              value: "1"
          startupProbe:
            httpGet:
              path: /startupz
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 30
            failureThreshold: 3
